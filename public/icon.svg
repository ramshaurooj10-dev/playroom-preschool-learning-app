<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Inner Soft Rounded Badge -->
  <rect x="32" y="32" width="448" height="448" rx="88" fill="url(#badgeGrad)" filter="url(#shadow)"/>

  <!-- Mane Layer 1 -->
  <circle cx="256" cy="240" r="160" fill="#78350F"/>
  <!-- Mane Layer 2 -->
  <circle cx="256" cy="240" r="140" fill="#B45309"/>

  <!-- Ears -->
  <circle cx="160" cy="140" r="40" fill="#D97706"/>
  <circle cx="160" cy="140" r="22" fill="#FEF3C7"/>
  <circle cx="352" cy="140" r="40" fill="#D97706"/>
  <circle cx="352" cy="140" r="22" fill="#FEF3C7"/>

  <!-- Face -->
  <ellipse cx="256" cy="245" rx="105" ry="110" fill="#F59E0B"/>

  <!-- Snout -->
  <ellipse cx="256" cy="285" rx="60" ry="45" fill="#FEF3C7"/>

  <!-- Nose -->
  <path d="M 235 265 L 277 265 L 256 290 Z" fill="#451A03" rx="4"/>

  <!-- Mouth -->
  <path d="M 238 298 Q 256 318 274 298" stroke="#451A03" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Eyes -->
  <ellipse cx="210" cy="220" rx="16" ry="20" fill="#1E293B"/>
  <ellipse cx="302" cy="220" rx="16" ry="20" fill="#1E293B"/>

  <!-- Eye Highlights -->
  <circle cx="215" cy="212" r="6" fill="#FFFFFF"/>
  <circle cx="307" cy="212" r="6" fill="#FFFFFF"/>

  <!-- Cheeks -->
  <ellipse cx="170" cy="260" rx="16" ry="10" fill="#F87171" opacity="0.6"/>
  <ellipse cx="342" cy="260" rx="16" ry="10" fill="#F87171" opacity="0.6"/>

  <!-- Golden Celebration Star -->
  <g transform="translate(390, 80) scale(1.4)">
    <polygon points="12,0 15,9 24,9 17,14 19,23 12,18 5,23 7,14 0,9 9,9" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
  </g>
</svg>
